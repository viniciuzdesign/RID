name: Diagnóstico no emulador

on:
  push:
    branches: [diagnostico]
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar NDK do Android
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android,wasm32-unknown-unknown

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: diagnostico
          cache-bin: "true"

      - name: Instalar Tauri CLI e Trunk
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          command -v trunk >/dev/null || cargo install trunk --locked

      - name: Preparar projeto Android
        run: |
          cargo tauri android init --ci
          cargo tauri icon src-tauri/app-icon.png

      - name: Compilar APK de release (x86_64, igual ao do celular)
        run: cargo tauri android build --apk --target x86_64 --ci

      - name: Assinar com chave temporária
        run: |
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          keytool -genkeypair -keystore tmp.p12 -storetype PKCS12 -alias tmp -keyalg EC -groupname secp256r1 \
            -validity 1 -storepass senha123 -keypass senha123 -dname "CN=Diag"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" alinhado.apk
          "$BT/apksigner" sign --ks tmp.p12 --ks-type PKCS12 --ks-key-alias tmp \
            --ks-pass pass:senha123 --key-pass pass:senha123 --out diag.apk alinhado.apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash ci/diagnostico.sh diag.apk
