name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar NDK do Android
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-bin: "true"

      - name: Instalar Tauri CLI e Trunk
        run: |
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          command -v trunk >/dev/null || cargo install trunk --locked

      - name: Preparar projeto Android
        run: |
          cargo tauri android init --ci
          cargo tauri icon src-tauri/app-icon.png
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/enable = true/enable = false/' "$GRADLE"
          if grep -q "enable = true" "$GRADLE" || ! grep -q "enable = false" "$GRADLE"; then
            echo "::error::Não consegui desligar o R8 em $GRADLE"; exit 1
          fi
          echo "R8 desligado:"; grep -n -B2 -A1 "enable = false" "$GRADLE"

      - name: Compilar APK
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: Assinar APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD no repositório."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > rid.p12
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          echo "APK gerado: $UNSIGNED"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" alinhado.apk
          "$BT/apksigner" sign --ks rid.p12 --ks-type PKCS12 --ks-key-alias rid \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS \
            --out RID.apk alinhado.apk
          "$BT/apksigner" verify RID.apk
          rm -f rid.p12

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RID build ${{ github.run_number }}
          prerelease: true
          files: RID.apk
